<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart – BookNest</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">📚 BookNest</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="books.html">Books</a>
      <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- CART CONTENTS -->
  <section class="featured">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>

    <div class="cart-summary">
      <h3>Total: ₹<span id="cart-total">0</span></h3>
      <button class="btn" onclick="checkout()">Proceed to Checkout</button>
      <button class="btn btn-outline" onclick="clearCart()">Clear Cart</button>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 BookNest. All rights reserved.</p>
  </footer>

  <script src="js/books.js"></script>
  <script src="js/cart.js"></script>
  <script>
    displayCart();
    updateCartCount();

    function checkout() {
      if (getCart().length === 0) {
        alert('Your cart is empty!');
        return;
      }
      alert('Order placed successfully! Thank you for shopping at BookNest 🎉');
      localStorage.removeItem('booknest_cart');
      displayCart();
      updateCartCount();
    }
  </script>
</body>
</html>
